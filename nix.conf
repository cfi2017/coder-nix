experimental-features = nix-command flakes
accept-flake-config = false
# Support legacy commands without channels or files in the mounted home.
# Keep this revision aligned with tests/flake/flake.nix.
nix-path = nixpkgs=flake:github:NixOS/nixpkgs/b6018f87da91d19d0ab4cf979885689b469cdd41
# Single-user Nix: no daemon, build users, systemd, or privileged container.
build-users-group =
# Container hosts commonly disallow the namespaces needed by Nix's sandbox.
# This image is intended for one trusted workspace owner per container.
sandbox = false
